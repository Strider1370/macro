name: Windows EXE 빌드

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser_macro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 자동 테스트 (실제 Windows)
        run: python -m pytest -v
      - name: EXE 만들기
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name BrowserLayoutMacro
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserLayoutMacro
          path: browser_macro/dist/BrowserLayoutMacro.exe
